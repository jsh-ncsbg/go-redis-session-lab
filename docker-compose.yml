services:
  redis:
    image: redis:8-alpine
    container_name: rsl-redis
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --save
      - ""
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5